server:
  port: 8080

spring:
  application:
    name: ai-qa-platform

aiqa:
  llm:
    # Which LlmClient implementation is active: "openai" (default), "gemini",
    # or "router" (rotates through every candidate in aiqa.router.chain
    # below, falling through to the next on any failure - missing key,
    # network error, rate limit, bad response).
    #
    # IMPORTANT: this must be exactly one of those three values - "groq" (a
    # chain *entry*, not a provider selector) was set here before, which
    # matched none of OpenAIService/GeminiService/AiRouterService's
    # @ConditionalOnProperty checks, so NO LlmClient bean existed and the
    # app failed to start / never generated a single test case.
    provider: ${LLM_PROVIDER:router}

  openai:
    base-url: https://api.openai.com/v1
    model: gpt-4o-mini
    api-key: ${OPENAI_API_KEY:}
    timeout-seconds: 60
    temperature: 0.2

  gemini:
    base-url: https://generativelanguage.googleapis.com/v1beta
    # Check https://ai.google.dev/api/models against your own key if this
    # 404s - Gemini model availability changes over time (1.5 and 2.0 series
    # have both been retired as of mid-2026).
    model: gemini-2.5-flash
    api-key: ${GEMINI_API_KEY:}
    timeout-seconds: 60
    temperature: 0.2

  # Rotating multi-provider chain (aiqa.llm.provider=router), ported from
  # the ai-router Python package. You don't need every key filled in - a
  # provider with no key configured is simply skipped and the router moves
  # on to the next one in "chain". IMPORTANT: free-tier model IDs change
  # over time and vary by account - double check each of these against the
  # provider's current docs before relying on them:
  #   Gemini:     https://ai.google.dev/api/models
  #   Groq:       https://console.groq.com/docs/models
  #   Mistral:    https://docs.mistral.ai/getting-started/models/
  #   GitHub Models: https://github.com/marketplace/models
  router:
    chain: [gemini, groq, mistral, github, ollama]
    timeout-seconds: 60
    max-tokens: 8192
    gemini-api-key: ${GEMINI_API_KEY:}
    gemini-model: gemini-2.5-flash
    gemini-base-url: https://generativelanguage.googleapis.com/v1beta
    groq-api-key: ${GROQ_API_KEY:}
    groq-model: llama-3.3-70b-versatile
    mistral-api-key: ${MISTRAL_API_KEY:}
    mistral-model: mistral-large-latest
    # A GitHub personal-access token (https://github.com/settings/tokens) - not the same as aiqa.git.hosts' clone token.
    github-token: ${GITHUB_MODELS_TOKEN:}
    github-model: openai/gpt-4o-mini
    # Local Ollama - no key needed, install from https://ollama.com and run `ollama serve`.cmd
    ollama-host: ${OLLAMA_HOST:http://localhost:11434}
    ollama-model: qwen2.5-coder:7b

  pipeline:
    output-dir: generated-tests
    impact-depth: 2
    # BATCH SIZE, not a cap - a merge with more changed files than this is
    # split across several LLM calls per category and every file is still
    # covered. Keep it in step with max-prompt-chars below: each file
    # contributes up to ~4,100 chars of diff, so 40 files ~= 164,000 chars of
    # diff plus ~52,000 of fixed context. Set it so a full batch lands UNDER
    # max-prompt-chars, otherwise every batch gets split anyway and each
    # split re-sends the fixed context again - which is pure waste.
    max-changed-files: 40
    # Soft budget for one prompt (~4 chars per token, so 400,000 ~= 100k
    # tokens). Comfortably inside Gemini 2.5 Flash's context window. Lower it
    # if your primary model has a smaller window or you want to cap spend per
    # call; a batch that exceeds it is split in half and retried, so nothing
    # is ever dropped - it just costs more calls.
    max-prompt-chars: 400000
    # "MANUAL" (business/functional test cases for QA - default), "AUTOMATED"
    # (JUnit/Jest/pytest/etc. source files), or "BOTH".
    default-test-case-mode: MANUAL
    # One dedicated LLM call per category, merged - this is what guarantees
    # real negative/boundary/security coverage instead of a single prompt
    # that tends to front-load happy-path cases. Trim this list to reduce
    # cost (fewer LLM calls per run) at the expense of coverage breadth.
    test-case-categories:
      - POSITIVE
      - NEGATIVE
      - BOUNDARY
      - SECURITY
    # How many categories to request in a SINGLE LLM call.
    #   1 (default) - one call per category. Best depth per category, because
    #                 the model's whole response budget goes to one focus.
    #   2           - pairs categories (POSITIVE+NEGATIVE, BOUNDARY+SECURITY),
    #                 halving both call count and token spend. All categories
    #                 are still covered, but each tends to get fewer cases
    #                 since the model splits attention across the two asks.
    # Raise this only when token budget is the binding constraint - it trades
    # depth for cost, unlike max-prompt-chars/max-changed-files which are pure
    # efficiency wins.
    categories-per-call: 1
    # How many existing catalog cases to show the model as NEW-vs-UPDATE
    # context. This is re-sent on EVERY call, so it's the largest piece of
    # avoidable repeated cost - 120 entries is ~36,000 chars per call. 40 is
    # ample for the model to spot an existing case worth updating.
    max-existing-test-cases-per-category: 40
    # How many manual test cases /generate-automation converts per LLM call.
    # The constraint here is the OUTPUT limit, not the prompt: each case
    # becomes a full REST Assured method, so too many in one response blows
    # aiqa.router.max-tokens and comes back truncated mid-string - unparseable,
    # losing every case in that call. A batch that still overflows is split in
    # half and retried rather than discarded.
    max-cases-per-automation-call: 5

    # --- POST /execute-automation: running generated scripts with TestNG ---
    # How long to wait for the TestNG subprocess before killing it. This bounds
    # a HUNG run, not a slow one: the child does real network I/O against a
    # target that may itself be wedged, and without a ceiling one unresponsive
    # endpoint pins a request thread indefinitely. The whole suite shares this
    # budget, not each test.
    execution-timeout-seconds: 300
    # Per-body cap on captured HTTP request/response payloads. Longer bodies are
    # truncated (with the full length noted) so one endpoint returning a
    # multi-megabyte list can't make the API response unusable.
    max-captured-body-chars: 8000
    # Ceiling on exchanges recorded per run. Tests keep running once it's hit -
    # only the capture stops - so a script looping over a thousand ids degrades
    # its own evidence rather than filling the disk.
    max-captured-exchanges: 500

    # When true (default), a merge that changes configuration files
    # (application.yml, .properties, Dockerfile, pom.xml, .env, etc. - see
    # ConfigType) gets its own "Configuration" test-case category instead of
    # being silently skipped for having no changed *source* files.
    config-change-detection-enabled: true

  # Provider-agnostic clone/fetch credentials, shared by /generate-tests-from-branch,
  # the GitHub webhook, and the GitLab webhook alike. Add one entry per host you
  # need to read from - github.com, gitlab.com, a self-hosted GitLab, or a bare
  # internal git server (IP or hostname). "scheme" is optional and only needed
  # when auto-detection from the hostname ("github"/"gitlab" substring) is wrong,
  # e.g. for an internal/on-prem server:
  #   TOKEN_AS_USERNAME - GitHub-style (token in username, blank password)
  #   TOKEN_AS_PASSWORD - GitLab-style (non-blank username, token as password) -
  #                       also the safe default for unknown/generic git servers
  git:
    workspace-dir: repo-workspace
    # Where processed-merge history is recorded (see MergeHistoryService),
    # relative to workspace-dir. Run POST /api/v1/generate-tests-from-branch/backfill
    # once per branch to populate this from all past merges; after that,
    # /generate-tests-from-branch and the webhooks only do work for new ones.
    history-dir: merge-history
    default-token: ${GIT_TOKEN:}
    default-scheme: TOKEN_AS_PASSWORD
    hosts:
      - host: github.com
        token: ${GITHUB_TOKEN:}
      - host: gitlab.com
        token: ${GITLAB_TOKEN:}
      # Self-hosted GitLab (the "not authorized" TransportException host):
      - host: 10.88.230.18
        token: ${INTERNAL_GIT_TOKEN:}
        scheme: TOKEN_AS_PASSWORD

  github:
    webhook-secret: ${GITHUB_WEBHOOK_SECRET:}
    # Leave empty to react to approvals on any base branch, or restrict e.g.:
    # watched-base-branches: [Release]

  gitlab:
    webhook-secret: ${GITLAB_WEBHOOK_SECRET:}
    # Leave empty to react to approvals on any target branch, or restrict e.g.
    # to only "takapay/release" (GitLab's webhook UI has no branch filter for
    # merge request events, so this is where that filtering happens):
    watched-base-branches: ["takapay/release"]

logging:
  level:
    com.company.aiqa: INFO
